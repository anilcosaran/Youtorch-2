{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "modelvend.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    # After the database (-1) and the migration (0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: modelvend
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "modelvend.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "modelvend.podSecurity" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "modelvend.image" $.Values.images.services | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [/usr/local/bin/{{ $name }}]
          env:
            {{- include "modelvend.goEnv" $ | nindent 12 }}
            - name: HTTP_ADDR
              value: ":{{ $svc.port }}"
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- include "modelvend.containerSecurity" $ | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "modelvend.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/part-of: modelvend
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
