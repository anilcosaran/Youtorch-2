name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modelvend
          POSTGRES_PASSWORD: modelvend
          POSTGRES_DB: modelvend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelvend -d modelvend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://modelvend:modelvend@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The generated types match api/public.yaml
        run: |
          npm run gen --workspace packages/api-types
          git diff --exit-code packages/api-types/src

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/modelvend -f deploy/helm/modelvend/values-dev.yaml
      - run: helm template modelvend deploy/helm/modelvend -f deploy/helm/modelvend/values-dev.yaml --namespace modelvend > /dev/null
