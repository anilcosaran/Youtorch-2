openapi: 3.1.0
info:
  title: Modelvend webhooks
  version: "1"
  description: |
    What Modelvend sends to a task's `webhook_url`. Delivery isn't live yet; the format is fixed so SDKs can verify it.

    Each request carries `Modelvend-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">` and
    `Modelvend-Idempotency-Key: <task id>-<status>`. Failed deliveries are retried with backoff for 24 hours.
webhooks:
  taskFinished:
    post:
      summary: A task reached a final status
      description: Fired as task.succeeded, task.failed or task.canceled. The body is the task.
      parameters:
        - name: Modelvend-Signature
          in: header
          required: true
          schema:
            type: string
        - name: Modelvend-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "public.yaml#/components/schemas/Task"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
