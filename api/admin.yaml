  /apps/{slug}/releases/{number}:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/ReleaseNumber" }
    patch:
      tags: [Apps]
      operationId: updateRelease
      summary: Change a draft release
      description: |
        Steps run in order and may read `{{input.x}}` and `{{steps.<id>.output.x}}` of earlier steps; `outputMap` builds
        what the customer gets. Parameters aren't merged: a step's input is exactly its template.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseUpdate" }
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{slug}/releases/{number}/publish:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/ReleaseNumber" }
    post:
      tags: [Apps]
      operationId: publishRelease
      summary: Deploy a draft release
      description: |
        It becomes the live release and the previous one is superseded. A paused app stays paused until resumed. 422
        `no_steps`, `invalid_release` (a template or the output map), `version_not_live`, `no_price`, or `low_margin`
        under the minimum margin without a `reason`. 403 `below_cost` below cost without `pricing.below_cost`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRelease" }
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{slug}/rollback:
    parameters:
      - { $ref: "#/components/parameters/Slug" }
    post:
      tags: [Apps]
      operationId: rollbackApp
      summary: Make a superseded release live again
      description: Its steps may use deprecated versions, which still answer. A paused app stays paused.
