openapi: 3.1.0
info:
  title: Modelvend Admin API
  version: "1"
  description: |
    What the operator panel calls. Only the panel is a client, so field names stay camelCase, as its code does.

    Money: unit prices and costs are decimal strings in US dollars per billing unit, such as "0.084". Amounts are
    whole micro-dollars and end in `Micros` (1,000,000 = $1), so they add up without rounding.

    Times are UTC. Every request that changes state must be `Content-Type: application/json`, or the server answers
    415 `unsupported_media_type`.

    Errors are `{"error": {"code", "message", "fields"}}`. `fields` names the fields at fault; nothing changes unless
    every field is valid.

    Operations with `x-phase` come later, in that phase of docs/roadmap.md. They are written down so the shapes are
    settled, and they aren't served yet. The rest are checked against the mock API by
    apps/admin/src/mock-api/contract.test.ts, until the Go server replaces it in phase 1.
servers:
  - url: https://admin.modelvend.ai/admin/v1
security:
  - session: []
tags:
  - name: Auth
  - name: Operators
  - name: Audit
  - name: Overview
  - name: Settings
  - name: Models
  - name: Apps
  - name: Providers
  - name: Customers
  - name: API keys
  - name: Tasks
  - name: Announcements

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        401 `unauthorized` for an unknown email, a wrong password or a disabled account alike, so the answer doesn't
        tell which. After a few failures per account or address the server answers 429 `rate_limited` with
        `Retry-After`, even to the right password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. Sets the session cookie.
          headers:
            Set-Cookie:
              description: "`__Host-mv_admin_session=<value>; Path=/; Secure; HttpOnly; SameSite=Lax`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this session and clear the cookie
      security: []
      responses:
        "204": { description: Signed out, even without a session. }
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in operator
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "401": { $ref: "#/components/responses/Error" }
  /me/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: |
        Ends the operator's other sessions. 422 `fields.currentPassword` when it is wrong, `fields.newPassword` when
        the new one is shorter than 12 characters or the same as the current one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204": { description: Changed. }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/two-factor:
    post:
      x-phase: 7
      tags: [Auth]
      operationId: enrollTwoFactor
      summary: Start two-factor enrollment
      description: Two-factor sign-in is required for operators before production.
      responses:
        "200":
          description: The secret to add to an authenticator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorEnrollment" }
        "401": { $ref: "#/components/responses/Error" }
  /permissions:
    get:
      tags: [Operators]
      operationId: getPermissionCatalog
      summary: Every permission and access preset
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionCatalog" }
        "401": { $ref: "#/components/responses/Error" }
  /operators:
    get:
      tags: [Operators]
      operationId: listOperators
      summary: List operators
      responses:
        "200":
          description: Every operator.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Operator" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Operators]
      operationId: createOperator
      summary: Add an operator
      description: |
        A generated password comes back once and never again; a chosen one comes back as null. 409 `fields.email`
        when the email is taken. 403 when it gives access the signed-in operator doesn't hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewOperator" }
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOperator" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /operators/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Operators]
      operationId: updateOperator
      summary: Change an operator
      description: |
        Operators can't change their own role or permissions, or disable themselves (422 with the field). 422
        `invalid_state` when the change would leave no active admin. 403 for an operator who has access the signed-in
        one doesn't.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorUpdate" }
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operator" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /operators/{id}/reset-password:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Operators]
      operationId: resetOperatorPassword
      summary: Reset an operator's password
      description: |
        Ends the operator's sessions. Without `password` one is generated and returned. 422 `own_password` for your
        own account, which goes through /me/password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPassword" }
      responses:
        "200":
          description: The generated password, or null for a chosen one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: The audit log, newest first
      parameters:
        - { name: operatorId, in: query, schema: { type: string } }
        - name: action
          in: query
          description: 'Also matches dotted children: "version" matches "version.publish".'
          schema: { type: string }
        - name: targetType
          in: query
          description: What was changed, such as "model" or "customer"; used with `targetId`.
          schema: { type: string }
        - { name: targetId, in: query, schema: { type: string } }
        - name: customerId
          in: query
          description: Everything about one customer, including its API keys and task refunds.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Company-wide figures
      description: |
        Any signed-in operator may load it, but each figure needs the permission that guards the same data on its own
        screen, and the server leaves out what the operator can't see:

        | Figures | Needs |
        | ------- | ----- |
        | `tasks24h`, `errorRate24h`; per day `tasks`, `failed` | tasks.view |
        | `revenueMicros`; per day `revenueMicros` | catalog.view or customers.view |
        | `costMicros`; per day `costMicros` | providers.view |
        | `margin` | providers.view, and catalog.view or customers.view |
        | `activeCustomers7d`; per day `signups` | customers.view |
        | `liveModels`, `pausedModels`, `deprecatedVersions`, `topModels` | catalog.view |
        | `providersDegraded`, `providers` | providers.view |

        Revenue is what purchased credits paid for, less refunds. Gift credits and internal workspaces don't count.
      parameters:
        - name: range
          in: query
          schema: { $ref: "#/components/schemas/Range" }
      responses:
        "200":
          description: The figures the operator may see.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Platform settings
      description: Any signed-in operator may read them, since the price and limit screens need them.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change platform settings
      description: Takes effect at once, without a deploy. Written to the audit log with `reason`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List models, busiest first
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: modality, in: query, schema: { $ref: "#/components/schemas/Modality" } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ModelState" } }
        - { name: visibility, in: query, schema: { $ref: "#/components/schemas/Visibility" } }
        - { name: provider, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Models]
      operationId: createModel
      summary: Add a model
      description: |
        The model starts private with an empty draft version `v1`. 409 `fields.slug` when the ID is taken. Starting it
        wider than private needs `catalog.publish`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewModel" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/import:
    post:
      x-phase: 1
      tags: [Models]
      operationId: importModel
      summary: Import a model exported from another environment
      description: It arrives as a draft and is tested again before it can go live. Keys and usage don't move.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/templates:
    get:
      x-phase: 1
      tags: [Models]
      operationId: listModelTemplates
      summary: Upstream templates from catalog/templates
      description: The templates a new model can start from; they ship with deploys and customers never see them.
      responses:
        "200":
          description: Every template.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelTemplate" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    get:
      tags: [Models]
      operationId: getModel
      summary: One model with its versions
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Models]
      operationId: updateModel
      summary: Change a model's details
      description: |
        Widening `visibility` (private > unlisted > public) needs `catalog.publish`; narrowing needs only
        `catalog.edit`. Changing `disclosure` needs `catalog.publish`, and answers 422 `white_label_not_allowed` when no
        route of a version customers call could serve it. 409 `stale` when the model changed since `If-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelUpdate" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      x-phase: 1
      tags: [Models]
      operationId: deleteModel
      summary: Delete a model that was never published
      description: 422 `invalid_state` once any version has gone live; those stay, retired.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/export:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    get:
      x-phase: 1
      tags: [Models]
      operationId: exportModel
      summary: The model as a YAML manifest
      responses:
        "200":
          description: The manifest.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/access:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    get:
      x-phase: 1
      tags: [Models]
      operationId: getModelAccess
      summary: Workspaces allowed to call a private model
      responses:
        "200":
          description: The allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelAccess" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      x-phase: 1
      tags: [Models]
      operationId: setModelAccess
      summary: Replace the allowlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelAccess" }
      responses:
        "200":
          description: The allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelAccess" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/pause:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    post:
      tags: [Models]
      operationId: pauseModel
      summary: Stop new tasks
      description: |
        New tasks get 503 `model_paused`. Running tasks finish; queued ones wait, and fail with `queue_timeout` after
        the queue wait limit if the model isn't resumed. The model stays readable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/resume:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    post:
      tags: [Models]
      operationId: resumeModel
      summary: Take new tasks again
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
    post:
      tags: [Models]
      operationId: createVersion
      summary: Add a draft version
      description: "`from` copies schema, pricing, routing and routes from another version."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewVersion" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    patch:
      tags: [Models]
      operationId: updateVersion
      summary: Change a version
      description: |
        Schemas and pricing change only on drafts (422 `version_locked`); a live version's price moves through a price
        change, and its schema through a new version. `pricing` needs `pricing.edit`.

        Changing `pricing.unit` clears every route's tier costs, as their numbers meant another unit, and removing a
        tier removes its costs; publishing asks for them again. 409 `stale` when the model changed since `If-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionUpdate" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/publish:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    post:
      tags: [Models]
      operationId: publishVersion
      summary: Put a draft live
      description: |
        The first live version becomes the default. Refused with 422 and one of:

        - `invalid_schema`: a schema isn't usable.
        - `invalid_pricing`: `tierField` or `input.field` isn't in the input schema, or one of the field's values picks
          no tier.
        - `no_route`: no active route on an active provider.
        - `no_price`: a tier has no price.
        - `no_cost`: a usable route has no cost for a tier.
        - `white_label_not_allowed`: the model is white label and no usable route's provider allows it. The router
          skips the others.
        - `low_margin`: a tier is under the minimum margin and there is no `reason`.
        - `no_test`: from phase 1, a usable route has no passing test for the current schema, mapping and provider.

        403 `below_cost` when a tier sells below cost and the operator lacks `pricing.below_cost`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishVersion" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/default:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    post:
      tags: [Models]
      operationId: setDefaultVersion
      summary: Make a live version the default
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/deprecate:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    post:
      tags: [Models]
      operationId: deprecateVersion
      summary: Announce that a live version will stop
      description: |
        It keeps answering, with `Deprecation` and `Sunset` headers. The default version may be deprecated too. The
        sunset date allows retiring it; it doesn't retire it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeprecateVersion" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/retire:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    post:
      tags: [Models]
      operationId: retireVersion
      summary: Stop a deprecated version for good
      description: |
        Calls answer 410 `version_retired` with `replacement` as the suggestion, and are never forwarded. Can't be
        undone, so it waits until nothing counts on the version: 422 `before_sunset` until its sunset date has passed,
        `pinned_by_app` while a live app release pins it, `is_replacement` while another deprecated version suggests
        it, and `is_default` while it is the default and another version is live.
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/price-changes:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    get:
      x-phase: 1
      tags: [Models]
      operationId: listPriceChanges
      summary: The version's price revisions, newest first
      responses:
        "200":
          description: Every revision.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriceChange" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-phase: 1
      tags: [Models]
      operationId: createPriceChange
      summary: Change a live version's prices, now or on a date
      description: |
        Needs `pricing.edit`; a tier below cost also needs `pricing.below_cost`. Removing a tier or changing the unit
        needs a new version. With `dryRun` nothing changes and the answer is the preview.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPriceChange" }
      responses:
        "200":
          description: The revision, or its preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceChange" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/promos:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    get:
      x-phase: 1
      tags: [Models]
      operationId: listPromos
      summary: The version's promos
      responses:
        "200":
          description: Every promo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Promo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      x-phase: 1
      tags: [Models]
      operationId: createPromo
      summary: Add a dated promo
      description: This replaces `pricing.promo`, which has no dates. Customers pay the lowest of list, promo, private and locked prices.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPromo" }
      responses:
        "200":
          description: The promo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/routes:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
    post:
      tags: [Models]
      operationId: addRoute
      summary: Add a route
      description: |
        Costs are in the version's billing unit. On a version that answers customers it needs `catalog.publish`, and
        from phase 1 it isn't active until tested. 409 `stale` when the model changed since `If-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewRoute" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/routes/{routeId}:
    parameters:
      - { $ref: "#/components/parameters/Publisher" }
      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
      - { $ref: "#/components/parameters/RouteId" }
    patch:
      tags: [Models]
      operationId: updateRoute
      summary: Change a route
      description: |
        A version that answers customers keeps at least one active route (422 `no_route`; pause the model instead).
        The last route of a deprecated version with a sunset date may go `draining`. 409 `stale` when the model
        changed since `If-Match`.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteUpdate" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Models]
      operationId: deleteRoute
      summary: Remove a route
      description: 422 `no_route` when it is the last active route of a version that answers customers.
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /models/{publisher}/{slug}/versions/{version}/routes/{routeId}/test:
    parameters:
