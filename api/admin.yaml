      - { $ref: "#/components/parameters/Slug" }
      - { $ref: "#/components/parameters/Version" }
      - { $ref: "#/components/parameters/RouteId" }
    post:
      x-phase: 1
      tags: [Models]
      operationId: testRoute
      summary: Run the version through this route with a real request
      description: |
        Billed to the internal workspace and not counted as revenue. The result holds until the schema, the mapping or
        the provider changes. Publishing needs a passing test for every usable route.
      requestBody:
        required: true
